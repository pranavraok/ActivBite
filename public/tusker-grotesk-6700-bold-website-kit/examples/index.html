<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tusker Grotesk 6700 Bold Webfont Test</title>
  <link rel="stylesheet" href="../css/tusker-grotesk-6700-bold.css" />
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #f6f3ed;
      color: #111;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main {
      width: min(92vw, 960px);
    }
    h1 {
      margin: 0 0 1rem;
      font-size: clamp(4rem, 15vw, 11rem);
    }
    p {
      max-width: 680px;
      font-size: 1.1rem;
      line-height: 1.6;
    }
    code {
      background: rgba(0,0,0,.08);
      padding: .12rem .32rem;
      border-radius: .35rem;
    }
  </style>
</head>
<body>
  <main>
    <h1 class="tusker-hero">Tusker 6700</h1>
    <p>
      Place your licensed <code>TuskerGrotesk-6700Bold.woff2</code> file in the
      <code>/fonts</code> folder. If the heading above still looks like Impact,
      the licensed font file is missing or the filename/path is different.
    </p>
  </main>
</body>
</html>
