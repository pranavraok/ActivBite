# Optional Nginx snippet for self-hosted webfonts.
# Include only if your server does not already send correct font MIME types.

types {
  font/woff2 woff2;
  font/woff  woff;
}

location ~* \.(woff2|woff)$ {
  add_header Access-Control-Allow-Origin "*";
  expires 1y;
  add_header Cache-Control "public, immutable";
}
